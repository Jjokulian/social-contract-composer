<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contract Graph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="./">Social Contract Composer</a>
    <div class="bar-controls">
      <a class="bar-link" href="./" data-keep-contract="./">Contracts</a>
      <span class="bar-link current" aria-current="page">Graph</span>
      <a class="bar-link" href="levels.html">Levels</a>
      <a class="bar-link" href="compose.html">Compose</a>
      <a class="bar-link" href="globe.html">Globe</a>
      <a class="bar-link" href="guide.html">How to read</a>
      <label class="field">Store
        <select id="store"></select>
      </label>
      <label class="field">Contract
        <select id="contract"></select>
      </label>
    </div>
  </header>

  <main class="graph-layout">
    <section class="graph-main" aria-label="Graph of the contract">
      <div class="graph-toolbar">
        <fieldset class="layers">
          <legend>Show</legend>
          <label><input type="checkbox" id="layer-claims" checked> Clauses and claims</label>
          <label><input type="checkbox" id="layer-influences"> Measures and influences</label>
          <label><input type="checkbox" id="layer-consequences" checked> Consequences of breach</label>
          <label><input type="checkbox" id="layer-picos"> Picos</label>
        </fieldset>
        <button type="button" class="btn" id="fit">Fit to screen</button>
      </div>
      <div id="graph" class="graph-canvas" role="img" aria-label="Intents at the top; clauses, measures and consequences below, connected by the claims and influences between them. The same content is listed in the Contracts view."></div>
      <div class="graph-legend" aria-label="Legend">
        <span class="lg"><span class="lg-node claimed"></span>intent: claimed</span>
        <span class="lg"><span class="lg-node thin"></span>thin</span>
        <span class="lg"><span class="lg-node gap"></span>gap</span>
        <span class="lg"><span class="lg-node clause"></span>clause</span>
        <span class="lg"><span class="lg-node measure"></span>measure</span>
        <span class="lg"><span class="lg-line supports"></span>supports, sufficient</span>
        <span class="lg"><span class="lg-line contributes"></span>supports, contributes</span>
        <span class="lg"><span class="lg-line hinders"></span>hinders</span>
        <span class="lg"><span class="lg-line given"></span>given</span>
        <span class="lg"><span class="lg-line refines"></span>refines</span>
        <span class="lg"><span class="lg-line influence"></span>influence</span>
        <span class="lg"><span class="lg-line breach"></span>consequence of breach</span>
      </div>
    </section>
    <aside class="panel graph-panel" id="details" aria-live="polite"></aside>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>
  <script type="module" src="graph.js"></script>
</body>
</html>
