<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Contract Composer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <span class="brand">Social Contract Composer</span>
    <div class="bar-controls">
      <a class="bar-link" href="graph.html" data-keep-contract="graph.html">Graph</a>
      <a class="bar-link" href="compose.html">Compose</a>
      <a class="bar-link" href="guide.html">How to read</a>
      <label class="field">Contract
        <select id="contract"></select>
      </label>
      <label class="field">Society
        <select id="society">
          <option value="">None: assumptions unverified</option>
        </select>
      </label>
    </div>
  </header>

  <main class="layout">
    <article class="doc" id="doc" aria-live="polite">
      <p class="notice">Loading the composition…</p>
    </article>
    <aside class="panel" id="panel" aria-label="Parameters and findings"></aside>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
